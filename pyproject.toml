[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "miter"
dynamic = ["version"]
description = "Gradient-boosted decision trees with random oblique splits"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Kacper Piotrowski" },
]
keywords = ["gradient boosting", "decision trees", "oblique trees", "tabular", "machine learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21",
]

[project.urls]
Homepage = "https://github.com/misterekkk/miter"
Documentation = "https://misterekkk.github.io/miter/"
Changelog = "https://github.com/misterekkk/miter/blob/main/CHANGELOG.md"
Issues = "https://github.com/misterekkk/miter/issues"

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
arrow = ["pyarrow>=12.0"]
sklearn = ["scikit-learn>=1.2"]
test = ["pytest>=7.0", "pandas>=1.5", "scikit-learn>=1.2"]
dev = ["pytest>=7.0", "ruff", "mypy", "build"]

[tool.scikit-build]
cmake.version = ">=3.20"
cmake.build-type = "Release"
wheel.packages = ["python/miter"]
wheel.py-api = "cp312"
metadata.version.provider = "scikit_build_core.metadata.regex"
metadata.version.input = "python/miter/__init__.py"
sdist.exclude = ["benchmarks", "docs", ".github", "tests", ".venv*", "build*", "catboost_info", "GEMINI.md", "CLAUDE.md"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["extern", "build", "build-*", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]

[tool.mypy]
files = ["python/miter"]
python_version = "3.10"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*", "autogluon.*", "ConfigSpace", "ConfigSpace.*", "tabarena.*"]
ignore_missing_imports = true

[tool.cibuildwheel]
# cp310 / cp311 get version-specific wheels; cp312 builds one abi3 wheel for 3.12+ (wheel.py-api).
build = ["cp310-*", "cp311-*", "cp312-*"]
skip = ["*-musllinux_*", "*-win32", "*_i686"]
test-requires = ["pytest", "pandas", "scikit-learn"]
test-command = "pytest {project}/tests/python -q"

[tool.cibuildwheel.macos]
before-all = "brew install libomp"
# delocate bundles libomp into the wheel. Homebrew's libomp on the macOS 15 runners is built for
# macOS 15, so the wheels cannot claim less.
environment = { MACOSX_DEPLOYMENT_TARGET = "15.0" }

# The wheel tag: scikit-build-core takes it from _PYTHON_HOST_PLATFORM, which cibuildwheel sets
# to the python.org baseline unless given, ignoring MACOSX_DEPLOYMENT_TARGET.
[[tool.cibuildwheel.overrides]]
select = "*-macosx_arm64"
inherit.environment = "append"
environment = { _PYTHON_HOST_PLATFORM = "macosx-15.0-arm64" }

[[tool.cibuildwheel.overrides]]
select = "*-macosx_x86_64"
inherit.environment = "append"
environment = { _PYTHON_HOST_PLATFORM = "macosx-15.0-x86_64" }
