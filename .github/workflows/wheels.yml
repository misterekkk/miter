name: Wheels

# Builds the wheels and the sdist on every change to the build, and publishes them on request:
# run the workflow by hand with target=testpypi or pypi (trusted publishing; the pypi environment
# needs the owner's approval).
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'python/**'
      - 'CMakeLists.txt'
      - 'pyproject.toml'
      - '.github/workflows/wheels.yml'
  workflow_dispatch:
    inputs:
      target:
        description: "Publish to: none, testpypi or pypi"
        required: false
        default: "none"

# A push cancels the previous push build of its branch, never a manual (publishing) run.
concurrency:
  group: wheels-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

# Read-only token by default; the publish job adds id-token: write for trusted publishing.
permissions:
  contents: read

jobs:
  wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86_64 Linux, aarch64 Linux, Windows x64, macOS 15+ arm64 and x86_64 (the runner's
        # Homebrew libomp sets the minimum macOS version of the wheels)
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Build and test wheels
        shell: bash
        run: |
          python -m pip install "cibuildwheel>=3,<4"
          python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [wheels, sdist]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target != 'none'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.target }}
      # The deployment entry links to the package page.
      url: ${{ github.event.inputs.target == 'pypi' && 'https://pypi.org/project/miter/' || 'https://test.pypi.org/project/miter/' }}
    permissions:
      id-token: write  # trusted publishing: no API token stored in the repository
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to TestPyPI
        if: github.event.inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: github.event.inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
