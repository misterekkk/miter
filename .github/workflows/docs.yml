name: Deploy Documentation

# The Starlight site in docs/, published to GitHub Pages (https://misterekkk.github.io/miter/).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read  # deploy-pages reads the artifact's metadata
  contents: read
  id-token: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # GitHub Pages needs a public repository on the free plan; skip while the repo is private.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install miter (for the API reference)
        run: python -m pip install .

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build the site
        working-directory: docs
        run: |
          python scripts/api_reference.py
          python scripts/release_notes.py
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  # A separate job, as in GitHub's Pages template: deploying in the uploading job can query the
  # artifact before it is listed ("Found 0 artifact(s)").
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
