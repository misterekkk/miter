[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "miter"
dynamic = ["version"]
description = "Gradient-boosted decision trees with random oblique splits"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Kacper Piotrowski" },
]
keywords = ["gradient boosting", "decision trees", "oblique trees", "tabular", "machine learning"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
arrow = ["pyarrow>=12.0"]
sklearn = ["scikit-learn>=1.2"]
test = ["pytest>=7.0", "pandas>=1.5", "scikit-learn>=1.2"]
dev = ["pytest>=7.0", "ruff", "mypy", "build"]

[tool.scikit-build]
cmake.version = ">=3.20"
cmake.build-type = "Release"
wheel.packages = ["python/miter"]
wheel.py-api = "cp312"
metadata.version.provider = "scikit_build_core.metadata.regex"
metadata.version.input = "python/miter/__init__.py"
# extern/lignum (gitignored, patched in place) is shipped so the sdist builds on its own.
sdist.include = [
    "extern/lignum/CMakeLists.txt",
    "extern/lignum/LICENSE",
    "extern/lignum/NOTICE",
    "extern/lignum/include/**",
    "extern/lignum/src/**",
    "extern/lignum/extern/simdjson/**",
    "extern/lignum/python/lignum/__init__.py",
]
sdist.exclude = ["benchmarks", "docs", ".github", "tests", "lignum_patches", ".venv*", "build*", "catboost_info", "GEMINI.md", "CLAUDE.md"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["extern", "build", "build-*", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]

[tool.mypy]
files = ["python/miter"]
python_version = "3.10"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*", "autogluon.*", "ConfigSpace", "ConfigSpace.*", "tabarena.*"]
ignore_missing_imports = true

[tool.cibuildwheel]
# cp310 / cp311 get version-specific wheels; cp312 builds one abi3 wheel for 3.12+ (wheel.py-api).
build = ["cp310-*", "cp311-*", "cp312-*"]
skip = ["*-musllinux_*", "*-win32", "*_i686"]
test-requires = ["pytest", "pandas", "scikit-learn"]
test-command = "pytest {project}/tests/python -q"

[tool.cibuildwheel.macos]
before-all = "brew install libomp"
# Homebrew's libomp targets the runner's macOS; delocate bundles it into the wheel.
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0" }
