[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "miter"
dynamic = ["version"]
description = "Gradient-boosted decision trees with random oblique splits"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Kacper Piotrowski" },
]
keywords = ["gradient boosting", "decision trees", "oblique trees", "tabular", "machine learning"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
arrow = ["pyarrow>=12.0"]
sklearn = ["scikit-learn>=1.2"]
test = ["pytest>=7.0"]
dev = ["pytest>=7.0", "ruff", "mypy", "build"]

[tool.scikit-build]
cmake.version = ">=3.20"
cmake.build-type = "Release"
wheel.packages = ["python/miter"]
wheel.py-api = "cp312"
metadata.version.provider = "scikit_build_core.metadata.regex"
metadata.version.input = "python/miter/__init__.py"
sdist.exclude = ["benchmarks", "docs", ".github", "tests", "lignum_patches", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["extern", "build", "build-*", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]

[tool.mypy]
files = ["python/miter"]
python_version = "3.10"
ignore_missing_imports = true
